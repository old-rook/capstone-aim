[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtg-judge-ai"
version = "0.1.0"
description = "MTG Rules and Gatherer QA Assistant. This is an unofficial application."
readme = "README.md"
requires-python = ">=3.13.3"
authors = [
    { name = "Hainsuu" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "google-genai>=2.34.0",
    "streamlit>=1.35.0",
    "cachetools>=5.3.3",
    "python-dotenv>=1.0.1",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-watcher>=0.6.3",
    "ruff>=0.4.0",
]
# Ensure hatchling includes .md prompt files in distribution packages
[tool.hatch.build.targets.wheel.package-data]
mtg_judge_ai = ["prompts/*.md"]

# Replaces pytest.ini completely
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"